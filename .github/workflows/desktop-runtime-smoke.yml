name: Desktop Runtime Smoke

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "hardening/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  desktop-runtime-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Build frozen desktop sidecar
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "sentinext-desktop-build.log"
          python apps/desktop/pyinstaller/build.py --target-triple x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## Desktop build failure"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```text'
            Get-Content -Path $log -Tail 160 | Add-Content -Path $env:GITHUB_STEP_SUMMARY
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '```'
            # Surface the tail through check annotations as well.  Public
            # viewers can inspect these even when raw Actions logs require
            # authentication; keep the output limited to the final 80 lines.
            $diagnostic = (Get-Content -Path $log -Tail 200) -join "`n"
            Write-Output "::error file=desktop-build.log::$diagnostic"
            exit $code
          }

      - name: Run frozen executable self-test
        run: apps/desktop/pyinstaller/dist/sentinext-backend.exe --self-test

      - name: Start frozen sidecar and verify runtime
        run: python tooling/smoke_desktop_sidecar.py --exe apps/desktop/pyinstaller/dist/sentinext-backend.exe
