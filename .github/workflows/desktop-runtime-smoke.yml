name: Desktop Runtime Smoke

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "hardening/**"
    paths:
      - "apps/api/**"
      - "apps/desktop/**"
      - "tooling/smoke_desktop_sidecar.py"
      - ".github/workflows/desktop-runtime-smoke.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "apps/desktop/**"
      - "tooling/smoke_desktop_sidecar.py"
      - ".github/workflows/desktop-runtime-smoke.yml"
  workflow_dispatch:

concurrency:
  group: desktop-runtime-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-runtime-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements-core.txt
            apps/desktop/pyinstaller/requirements-desktop.txt

      - name: Build frozen desktop sidecar
        run: python apps/desktop/pyinstaller/build.py --target-triple x86_64-pc-windows-msvc

      - name: Run frozen executable self-test
        run: apps/desktop/pyinstaller/dist/sentinext-backend.exe --self-test

      - name: Start frozen sidecar and verify runtime
        run: python tooling/smoke_desktop_sidecar.py --exe apps/desktop/pyinstaller/dist/sentinext-backend.exe
