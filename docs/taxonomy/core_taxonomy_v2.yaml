{
  "taxonomy_version": "stra-core-taxonomy-v2",
  "schema_version": "core-taxonomy-source-v1",
  "topics": [
    {"id": "overall_experience/general", "definition": "The review evaluates the overall game experience without a more specific topic.", "include": "Holistic experience judgments that cannot be assigned more precisely.", "exclude": "Specific mechanics, technical defects, content, interface, service, or commercial claims.", "boundary": "Use only when no specific topic is supported by the evidence.", "typical_examples": ["The game is enjoyable overall."], "counterexamples": ["The controls feel unresponsive."]},
    {"id": "gameplay/mechanics", "definition": "How the game's rules and systems work during play.", "include": "Rules, interactions, combat systems, resource loops, and systemic behavior.", "exclude": "Player input feel, relative option strength, or absolute challenge.", "boundary": "Mechanics describe system operation; controls describe input operation.", "typical_examples": ["The parry system rewards timing."], "counterexamples": ["The buttons feel delayed."]},
    {"id": "gameplay/controls", "definition": "How player input operates and feels in gameplay.", "include": "Responsiveness, mappings, input timing, aiming, movement, and control feel.", "exclude": "Device compatibility or the underlying game rule.", "boundary": "Controls are input experience; input_device_support is device capability.", "typical_examples": ["Dodging feels precise."], "counterexamples": ["The game lacks controller support."]},
    {"id": "gameplay/balance", "definition": "Relative strength, fairness, or viability of legitimate gameplay options.", "include": "Overpowered builds, weak choices, encounter fairness, and option parity.", "exclude": "Absolute challenge level or player input quality.", "boundary": "Balance compares options; difficulty describes challenge faced regardless of option parity.", "typical_examples": ["One weapon dominates every build."], "counterexamples": ["The boss is hard for everyone."]},
    {"id": "gameplay/difficulty", "definition": "The absolute challenge experienced while playing.", "include": "Difficulty spikes, accessibility of challenge, and required execution level.", "exclude": "Relative strength of options or progression speed.", "boundary": "Difficulty is absolute challenge; balance is relative fairness between options.", "typical_examples": ["The final boss is too difficult."], "counterexamples": ["This weapon is stronger than all others."]},
    {"id": "gameplay/progression", "definition": "Player advancement through unlocks, levels, gear, skills, or grind.", "include": "XP, upgrades, unlock pacing, advancement gates, and progression rewards.", "exclude": "Narrative or activity pacing and monetization pressure.", "boundary": "Progression advances the player; content_pacing controls the rhythm of content.", "typical_examples": ["Unlocking skills takes too long."], "counterexamples": ["The story moves too slowly."]},
    {"id": "gameplay/ai_behavior", "definition": "Behavior and decision quality of non-player or system-controlled agents.", "include": "Enemy tactics, ally behavior, pathfinding, and agent consistency.", "exclude": "Human matchmaking or multiplayer moderation.", "boundary": "Use for in-game agents, not network opponents or cheating.", "typical_examples": ["Allies stop following objectives."], "counterexamples": ["Matchmaking takes ten minutes."]},
    {"id": "technical/performance", "definition": "Runtime speed, smoothness, resource use, or frame stability.", "include": "Stutter, frame rate, latency caused by local performance, and loading speed.", "exclude": "Crashes, hangs, connection quality, or installation failure.", "boundary": "Performance is slow or uneven operation; stability_crashes is termination or freeze.", "typical_examples": ["The frame rate drops in cities."], "counterexamples": ["The game crashes on launch."]},
    {"id": "technical/bugs", "definition": "A functional technical defect not better classified by a specific technical category.", "include": "Broken behavior, incorrect state, and reproducible software defects.", "exclude": "Performance, crashes, networking, saves, compatibility, and launch-specific defects when those apply.", "boundary": "Specific technical categories take precedence over this fallback technical defect.", "typical_examples": ["The quest flag never updates."], "counterexamples": ["The game freezes every session."]},
    {"id": "technical/stability_crashes", "definition": "Termination, freezing, hanging, or loss of runtime stability.", "include": "Crashes, hard locks, freezes, hangs, and repeated unexpected exits.", "exclude": "Slow performance or ordinary functional bugs.", "boundary": "A crash or hang is stability even when a bug causes it.", "typical_examples": ["It crashes whenever I enter the hub."], "counterexamples": ["Menus take two seconds to open."]},
    {"id": "technical/compatibility", "definition": "Whether the product works with a hardware, operating-system, or software environment.", "include": "Platform conflicts, drivers, display setups, and hardware-specific support.", "exclude": "Input-device feature support and installation mechanics.", "boundary": "Compatibility is environment interoperability; input_device_support is an available input capability.", "typical_examples": ["The game conflicts with my ultrawide monitor."], "counterexamples": ["There are no remappable controls."]},
    {"id": "technical/networking", "definition": "Quality and reliability of network communication during online play.", "include": "Disconnects, packet loss, synchronization, and online latency.", "exclude": "Who gets matched, moderation, or local performance.", "boundary": "Networking is connection quality; matchmaking is pairing behavior.", "typical_examples": ["The server drops me during matches."], "counterexamples": ["It pairs me with beginners."]},
    {"id": "technical/installation_launch", "definition": "Installation, update installation, startup, and initial launch behavior.", "include": "Install failures, launch errors, patch application, and startup configuration.", "exclude": "Runtime crashes after successful launch and general compatibility.", "boundary": "Use for getting the product installed or started; runtime termination belongs to stability_crashes.", "typical_examples": ["The update will not install."], "counterexamples": ["It crashes after an hour of play."]},
    {"id": "technical/save_data", "definition": "Persistence, loading, cloud synchronization, and integrity of player progress.", "include": "Missing saves, corrupt files, cloud conflicts, and lost progress.", "exclude": "Player advancement design or ordinary loading speed.", "boundary": "Save data concerns persisted state, not progression rules.", "typical_examples": ["My cloud save overwrote my progress."], "counterexamples": ["The XP curve is too slow."]},
    {"id": "content/scope_variety", "definition": "Amount, breadth, and variety of first-order game content.", "include": "Content volume, activity variety, enemy variety, and environmental breadth.", "exclude": "Spatial design, replay reasons, and narrative pacing.", "boundary": "Scope_variety measures what content exists; world_level_design measures how spaces are arranged.", "typical_examples": ["There are too few mission types."], "counterexamples": ["The levels are poorly laid out."]},
    {"id": "content/world_level_design", "definition": "Spatial structure and design of worlds, levels, maps, and encounters.", "include": "Map layout, level flow, traversal spaces, encounter spaces, and environmental structure.", "exclude": "Visual presentation and total content volume.", "boundary": "World_level_design is spatial structure; visuals_art is appearance.", "typical_examples": ["The map funnels every route into one corridor."], "counterexamples": ["The art direction is beautiful."]},
    {"id": "content/activities_modes", "definition": "Design and quality of quests, missions, activities, and play modes.", "include": "Mode rules, mission structure, objectives, and activity execution.", "exclude": "Overall quantity of content and narrative writing.", "boundary": "Use for the design of an activity; scope_variety covers how many kinds exist.", "typical_examples": ["The side missions repeat the same objective."], "counterexamples": ["The game needs more kinds of activities."]},
    {"id": "content/narrative_characters", "definition": "Writing, story content, characterization, and narrative coherence.", "include": "Plot, dialogue, lore, character arcs, and narrative delivery as content.", "exclude": "Voice performance, audio, and in-game pacing.", "boundary": "Narrative_characters is writing/content; voice_acting is performance/delivery.", "typical_examples": ["The character arc feels unfinished."], "counterexamples": ["The voice performance is flat."]},
    {"id": "content/replayability", "definition": "Reasons and quality of continuing or replaying after an initial completion.", "include": "Build variety, replay loops, endgame longevity, and repeat-play incentives.", "exclude": "First-play content volume and progression during one playthrough.", "boundary": "Replayability is return value after or beyond completion; scope_variety is first-order content breadth.", "typical_examples": ["There is no reason to replay the campaign."], "counterexamples": ["The opening has too few missions."]},
    {"id": "content/content_pacing", "definition": "Rhythm and timing of narrative, levels, activities, or content delivery inside the game.", "include": "Pacing, downtime, escalation, repetition rhythm, and story/activity tempo.", "exclude": "Player advancement and real-world update frequency.", "boundary": "Content_pacing is in-game rhythm; progression is advancement and update_cadence is service timing.", "typical_examples": ["The middle chapters drag."], "counterexamples": ["The next level unlocks too late."]},
    {"id": "content/customization", "definition": "Options for personalizing appearance, loadouts, or player expression.", "include": "Cosmetics, character appearance, personalization, and non-progression customization.", "exclude": "Skill progression and monetization mechanism alone.", "boundary": "Customization concerns expression choices, not advancement choices.", "typical_examples": ["There are many outfit options."], "counterexamples": ["The skill tree unlocks too slowly."]},
    {"id": "ux_accessibility/interface_hud", "definition": "Organization and interaction of menus, HUD, screens, and interface controls.", "include": "Navigation, layout, menus, HUD arrangement, and interface interaction.", "exclude": "Whether information is legible and whether the game teaches the player.", "boundary": "Interface_hud is structure/interaction; readability_clarity is comprehension of presented information.", "typical_examples": ["The inventory takes too many screens to navigate."], "counterexamples": ["The text is too small to read."]},
    {"id": "ux_accessibility/readability_clarity", "definition": "Visibility and comprehensibility of information that the game presents.", "include": "Text size, contrast, visual clarity, explanation clarity, and information discoverability.", "exclude": "Interface structure and failure to teach a new mechanic.", "boundary": "Readability means information exists but is unclear; onboarding_learnability means teaching fails.", "typical_examples": ["The damage numbers are impossible to read."], "counterexamples": ["The tutorial never explains parrying."]},
    {"id": "ux_accessibility/quality_of_life", "definition": "Convenience features that reduce friction in ordinary use.", "include": "Filters, sorting, skip options, automation, inventory convenience, and friction reduction.", "exclude": "Core controls, visual readability, and formal accessibility accommodations.", "boundary": "QoL removes routine friction; interface_hud describes the interface structure itself.", "typical_examples": ["There is no way to mark all items as seen."], "counterexamples": ["The controller input is delayed."]},
    {"id": "ux_accessibility/input_device_support", "definition": "Availability and configuration capability for input devices and control setups.", "include": "Controller, keyboard, mouse, remapping, layouts, and device recognition.", "exclude": "Subjective input feel and hardware compatibility failures.", "boundary": "Input_device_support is device/configuration capability; controls is input feel.", "typical_examples": ["The game does not recognize my controller."], "counterexamples": ["The analog movement feels slippery."]},
    {"id": "ux_accessibility/accessibility", "definition": "Features and barriers affecting access for players with differing needs.", "include": "Captions, color options, remapping for access, motion settings, and assist options.", "exclude": "General readability or ordinary interface convenience.", "boundary": "Use when access needs or accommodations are central to the claim.", "typical_examples": ["There is no colorblind mode."], "counterexamples": ["The settings menu is nested too deeply."]},
    {"id": "ux_accessibility/onboarding_learnability", "definition": "How well the game teaches its rules, systems, and early play expectations.", "include": "Tutorials, first-use teaching, learning curve, tooltips as instruction, and discoverability of rules.", "exclude": "Information that is present but visually unclear.", "boundary": "Onboarding is failure to teach; readability_clarity is failure to communicate presented information.", "typical_examples": ["The tutorial never explains the crafting loop."], "counterexamples": ["The tutorial text is too low contrast."]},
    {"id": "presentation/visuals_art", "definition": "Visual appearance, art direction, rendering, and graphical presentation.", "include": "Art style, lighting, textures, effects, models, and visual cohesion.", "exclude": "Animation movement quality and spatial level structure.", "boundary": "Visuals_art is appearance; world_level_design is spatial organization.", "typical_examples": ["The environments have a striking art style."], "counterexamples": ["The character movement animation is jerky."]},
    {"id": "presentation/animation", "definition": "Quality, timing, and expressiveness of visual motion and animation.", "include": "Character animation, transitions, hit reactions, and animation bugs as presentation.", "exclude": "Still-image art direction and control responsiveness.", "boundary": "Animation is movement presentation even when it affects perceived polish.", "typical_examples": ["The attack animations blend smoothly."], "counterexamples": ["The controls respond too slowly."]},
    {"id": "presentation/audio_music", "definition": "Music, sound effects, mixing, and non-voice audio presentation.", "include": "Soundtrack, effects, volume balance, ambience, and audio fidelity.", "exclude": "Spoken performance and localization text.", "boundary": "Audio_music is sound design; voice_acting is spoken performance.", "typical_examples": ["The soundtrack makes exploration memorable."], "counterexamples": ["The dialogue delivery lacks emotion."]},
    {"id": "presentation/voice_acting", "definition": "Performance and delivery of spoken character or narrator voices.", "include": "Casting, delivery, expression, pronunciation, and recorded voice quality.", "exclude": "Dialogue writing and general audio mixing.", "boundary": "Voice_acting is performance/delivery; narrative_characters is writing/content.", "typical_examples": ["The cast delivers the dialogue convincingly."], "counterexamples": ["The story dialogue is poorly written."]},
    {"id": "presentation/localization", "definition": "Quality and completeness of language adaptation for supported regions and languages.", "include": "Translation, subtitles, localized UI, terminology, and language coverage.", "exclude": "General text readability without a language adaptation claim.", "boundary": "Localization concerns language adaptation, not all interface clarity.", "typical_examples": ["Several menu strings remain untranslated."], "counterexamples": ["The translated text is large enough but hard to scan."]},
    {"id": "online_community/multiplayer_experience", "definition": "The quality of cooperative or competitive play with other people.", "include": "Team play, cooperation, match flow, shared activities, and multiplayer enjoyment.", "exclude": "Pairing algorithm, connection quality, and moderation.", "boundary": "Multiplayer_experience is the play experience; matchmaking is pairing and networking is connection.", "typical_examples": ["Co-op objectives make teamwork rewarding."], "counterexamples": ["The queue takes too long to find a match."]},
    {"id": "online_community/matchmaking", "definition": "How the service selects and pairs players into online sessions.", "include": "Queue times, skill matching, region matching, team composition, and lobby assignment.", "exclude": "Connection reliability and the quality of the match after pairing.", "boundary": "Matchmaking determines who is paired; networking determines communication quality.", "typical_examples": ["The skill matching puts beginners against experts."], "counterexamples": ["The match disconnects halfway through."]},
    {"id": "online_community/social_features", "definition": "Features that support player social interaction and community connection.", "include": "Friends, parties, chat, guilds, profiles, and social discovery.", "exclude": "User-generated content production and safety enforcement.", "boundary": "Social_features enables interaction; moderation_safety governs harmful behavior and enforcement.", "typical_examples": ["It is easy to form a party with friends."], "counterexamples": ["Reports of harassment are ignored."]},
    {"id": "online_community/competitive_integrity", "definition": "Fairness and trustworthiness of competitive play.", "include": "Cheating, exploits, competitive rules, ranking integrity, and fair competition.", "exclude": "General connection problems and non-competitive social abuse.", "boundary": "Competitive_integrity protects fair competition; moderation_safety covers community safety enforcement.", "typical_examples": ["Ranked matches are full of exploit users."], "counterexamples": ["Voice chat contains abusive messages."]},
    {"id": "online_community/moderation_safety", "definition": "Safety, conduct standards, reporting, and enforcement in the community.", "include": "Harassment, abuse, reporting tools, bans, privacy, and community safety.", "exclude": "Competitive advantage from cheating and generic social features.", "boundary": "Moderation_safety addresses harmful conduct and response; competitive_integrity addresses fair competition.", "typical_examples": ["Reports of harassment receive no response."], "counterexamples": ["Aimbots decide every ranked match."]},
    {"id": "online_community/mods_ugc_ecosystem", "definition": "Player-created content, mod support, and the surrounding creator ecosystem.", "include": "Mod tools, workshop content, custom maps, creator publishing, and UGC discovery.", "exclude": "Official content variety and general social networking.", "boundary": "Use when players create or distribute content rather than merely discuss it.", "typical_examples": ["The workshop makes community maps easy to install."], "counterexamples": ["The official campaign needs more levels."]},
    {"id": "service_operations/update_quality", "definition": "The quality and outcome of a patch or service update.", "include": "Patch effectiveness, regressions, fixes, release quality, and update outcomes.", "exclude": "Current product defects without an update context and update frequency.", "boundary": "Update_quality evaluates the update outcome; technical topics describe the current defect and may co-occur.", "typical_examples": ["The patch fixed crashes but introduced stutter."], "counterexamples": ["The current save system loses files."]},
    {"id": "service_operations/update_cadence", "definition": "Frequency and timing of real-world updates and maintenance.", "include": "Patch frequency, release gaps, maintenance rhythm, and update delays.", "exclude": "In-game content pacing and the quality of a particular patch.", "boundary": "Update_cadence is service timing; content_pacing is in-game rhythm.", "typical_examples": ["Updates arrive only once a year."], "counterexamples": ["The campaign pacing slows in chapter three."]},
    {"id": "service_operations/roadmap_delivery", "definition": "Delivery of promised roadmap items, milestones, and announced plans.", "include": "Roadmap commitments, feature delivery, delays, cancellations, and milestone follow-through.", "exclude": "General public messaging without a delivery claim.", "boundary": "Roadmap_delivery concerns whether promised work arrives; developer_communication concerns communication itself.", "typical_examples": ["The announced mode still has no release date."], "counterexamples": ["The developer explains the maintenance window clearly."]},
    {"id": "service_operations/developer_communication", "definition": "One-to-many public communication from the developer or publisher.", "include": "Announcements, patch notes, status posts, transparency, and public messaging.", "exclude": "One-to-one support handling and whether roadmap promises are delivered.", "boundary": "Developer_communication is public communication; customer_support is individual case handling.", "typical_examples": ["Patch notes do not explain the changes."], "counterexamples": ["Support never answered my ticket."]},
    {"id": "service_operations/customer_support", "definition": "One-to-one assistance and handling of individual player cases.", "include": "Support tickets, account help, refunds handled by support, and response quality.", "exclude": "Public announcements and general product quality.", "boundary": "Customer_support is individual handling; developer_communication is one-to-many.", "typical_examples": ["Support resolved my account issue quickly."], "counterexamples": ["The public roadmap is vague."]},
    {"id": "commercial_model/pricing", "definition": "The absolute price charged for the product or an offered item.", "include": "Base price, sale price, entry price, and price level without regional comparison.", "exclude": "Regional price differences, paid content, and value relative to experience.", "boundary": "Pricing is price itself; value_for_money is experience relative to price.", "typical_examples": ["The launch price is too high."], "counterexamples": ["The regional price is much higher here."]},
    {"id": "commercial_model/regional_pricing", "definition": "Price differences or purchasing-power treatment across regions and currencies.", "include": "Regional pricing, currency conversion, localization of price, and parity.", "exclude": "Absolute price without a regional comparison.", "boundary": "Regional_pricing is geographic/currency differential; pricing is general price.", "typical_examples": ["The regional price ignores local purchasing power."], "counterexamples": ["The game is expensive everywhere."]},
    {"id": "commercial_model/paid_content", "definition": "Content or features sold separately from the base product.", "include": "DLC, expansions, paid packs, season content, and content-gating by purchase.", "exclude": "The price level of the base game and spending pressure mechanics.", "boundary": "Paid_content identifies the separately sold content; pricing evaluates the amount charged.", "typical_examples": ["The expansion adds a substantial new campaign."], "counterexamples": ["The base game price is excessive."]},
    {"id": "commercial_model/microtransactions", "definition": "Small or repeated in-product purchases as a monetization mechanism.", "include": "Cosmetic shops, currency packs, recurring small purchases, and item stores.", "exclude": "Fairness impact, pressure tactics, and one-time paid expansions.", "boundary": "Microtransactions identify the mechanism; fairness and pressure describe its effect.", "typical_examples": ["The store is built around small currency purchases."], "counterexamples": ["The expansion is sold as one large package."]},
    {"id": "commercial_model/monetization_fairness", "definition": "Whether monetization creates unfair advantage, restriction, or unequal treatment.", "include": "Pay-to-win, paywalled power, unfair progression, and competitive purchase advantage.", "exclude": "The mere existence of purchases and non-competitive spending pressure.", "boundary": "Fairness is an advantage/equality claim; microtransactions is the mechanism.", "typical_examples": ["Buying power makes ranked play unfair."], "counterexamples": ["The shop sells optional cosmetic colors."]},
    {"id": "commercial_model/monetization_pressure", "definition": "How monetization tactics pressure, manipulate, or strongly prompt spending.", "include": "FOMO, timed offers, grind-to-spend loops, intrusive prompts, and artificial scarcity.", "exclude": "Unfair competitive advantage and ordinary price complaints.", "boundary": "Pressure concerns spending compulsion; fairness concerns advantage or restriction.", "typical_examples": ["Limited-time bundles pressure players to buy now."], "counterexamples": ["The cosmetic bundle is expensive but optional."]},
    {"id": "commercial_model/value_for_money", "definition": "The perceived experience, content, and quality relative to the price paid.", "include": "Worth, value, cost-benefit, longevity for price, and purchase regret.", "exclude": "Absolute price and regional price differences without a value comparison.", "boundary": "Value_for_money compares experience to price; pricing states the price itself.", "typical_examples": ["There is enough content to justify the cost."], "counterexamples": ["The regional currency conversion is unfair."]}
  ]
}
