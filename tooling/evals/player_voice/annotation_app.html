<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SentiNext 玩家声音标注</title>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#202124;background:#f5f7fb}
    *{box-sizing:border-box} body{margin:0} header{background:#17233c;color:white;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
    header h1{font-size:19px;margin:0} main{display:grid;grid-template-columns:290px minmax(500px,1fr) 330px;gap:16px;max-width:1500px;margin:18px auto;padding:0 16px}
    .panel,.card{background:white;border:1px solid #e1e5ee;border-radius:10px;box-shadow:0 2px 8px #18233c0b}.panel{padding:14px}.list{max-height:calc(100vh - 120px);overflow:auto}
    .item{padding:10px;border-bottom:1px solid #edf0f5;cursor:pointer}.item:hover,.item.active{background:#eef4ff}.item small{display:block;color:#6b7280;margin-top:4px}.item.done{border-left:4px solid #21a366;padding-left:6px}
    .card{padding:22px}.meta{display:flex;gap:8px;flex-wrap:wrap;color:#5f6b7a;font-size:13px}.tag{background:#edf2fb;padding:4px 8px;border-radius:99px}.review{font-size:20px;line-height:1.65;white-space:pre-wrap;background:#fbfcfe;border-left:4px solid #5b7cfa;padding:18px;margin:18px 0}
    label{font-weight:650;display:block;margin:14px 0 6px} select,input,textarea{width:100%;font:inherit;border:1px solid #cbd3e1;border-radius:6px;padding:9px;background:white} textarea{min-height:78px;resize:vertical}.checks{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:230px;overflow:auto;border:1px solid #e5e9f1;padding:9px;border-radius:6px}.checks label{font-weight:400;margin:0;font-size:13px}.checks input{width:auto;margin-right:6px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buttons{display:flex;gap:8px;margin-top:18px}.btn{border:0;border-radius:7px;padding:10px 14px;cursor:pointer;font-weight:650}.primary{background:#2864e8;color:#fff}.secondary{background:#e8edf7;color:#24324d}.danger{background:#fff0f0;color:#a22}.progress{height:8px;background:#e8edf5;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:#2ca36a}.hint{color:#667085;font-size:13px;line-height:1.5}.status{font-weight:700;margin-top:10px;min-height:20px}.status.ok{color:#16834a}.status.err{color:#b42318}.nav{display:flex;justify-content:space-between;gap:8px}.nav button{flex:1}.hidden{display:none}@media(max-width:1050px){main{grid-template-columns:230px 1fr}.right{grid-column:1/-1}}@media(max-width:700px){main{display:block}.panel{margin-bottom:12px}.list{max-height:240px}}
  </style>
</head>
<body>
<header><h1>🎮 SentiNext 玩家声音标注</h1><span id="savePath">未连接</span></header>
<main>
  <section class="panel"><div class="nav"><button class="btn secondary" id="prev">上一条</button><button class="btn secondary" id="next">下一条</button></div><p class="hint">快捷键：Ctrl/Cmd+S 保存，←/→ 切换评论</p><div class="progress"><i id="bar"></i></div><p id="count" class="hint"></p><div class="list" id="list"></div></section>
  <section class="card"><div id="meta" class="meta"></div><div id="review" class="review"></div><p id="reason" class="hint"></p><div class="row"><div><label>标注状态</label><select id="status"><option value="labeled">已标注</option><option value="ambiguous">有歧义</option><option value="needs_adjudication">需要裁决</option><option value="exclude">排除</option><option value="pending">暂不处理</option></select></div><div><label>标注人 ID</label><input id="annotator" placeholder="例如：alice"></div></div><label>情感</label><select id="sentiment"><option value="">请选择</option><option value="positive">正面 positive</option><option value="negative">负面 negative</option><option value="mixed">混合 mixed</option><option value="neutral">中性 neutral</option><option value="uncertain">不确定 uncertain</option></select>
    <label>是否存在问题</label><select id="issue"><option value="">请选择</option><option value="true">是</option><option value="false">否</option></select><label>问题分类 / 子分类（可多选）</label><div id="issueLabels" class="checks"></div>
    <label>是否存在明确功能请求</label><select id="request"><option value="">请选择</option><option value="true">是</option><option value="false">否</option></select><label>请求分类 / 子分类（可多选）</label><div id="requestLabels" class="checks"></div>
    <label>原文证据片段（每行一条，必须逐字来自评论）</label><textarea id="evidence" placeholder="复制原文中的关键片段，每行一条"></textarea><div class="buttons"><button class="btn primary" id="save">保存本条</button><button class="btn secondary" id="saveNext">保存并下一条</button></div><div id="statusMsg" class="status"></div></section>
  <section class="panel right"><h3>Codex 草稿（仅供核验）</h3><div id="draft"></div><hr><h3>标注提醒</h3><p class="hint">先独立阅读左侧原文，再参考草稿。草稿绝不能直接当作 Gold。</p><ul class="hint"><li>不满不等于功能请求。</li><li>一句话可以有多个问题标签。</li><li>证据必须是原文连续片段。</li><li>拿不准时选“不确定”或“需要裁决”。</li><li>Gameplay 与 Content/Design、Technical 与 UI/UX 边界要遵循规范。</li></ul><p class="hint">草稿与 Gold 分开保存；页面不会写入生产 review_labels 缓存。</p></section>
</main>
<script>
let records=[],index=0,manifest={};
const $=id=>document.getElementById(id);
async function boot(){manifest=await (await fetch('/api/options')).json();const data=await (await fetch('/api/records')).json();records=data.records;$('savePath').textContent='保存到：'+data.output;renderList();render();}
function labels(container,selected){$(container).innerHTML=(manifest.subcategories?Object.entries(manifest.subcategories):[]).flatMap(([group,items])=>items.map(x=>`<label title="${group}"><input type="checkbox" value="${x}" ${selected.includes(x)?'checked':''}>${x}</label>`)).join('');}
function values(id){return [...$(id).querySelectorAll('input:checked')].map(x=>x.value)}
function renderList(){ $('list').innerHTML=records.map((r,i)=>`<div class="item ${i===index?'active ':''}${r.annotation_status==='labeled'?'done':''}" data-i="${i}"><b>${i+1}. ${r.language||'未知语言'}</b><small>${r.sampling_stratum} · ${r.review_id||r.sample_id} · ${r.annotation_status}</small></div>`).join('');document.querySelectorAll('.item').forEach(x=>x.onclick=()=>{index=Number(x.dataset.i);render()});}
function render(){if(!records.length)return;const r=records[index],g=r.gold||{},d=r.codex_draft?.codex_draft||null,dr=r.codex_draft;$('meta').innerHTML=`<span class="tag">${r.index||index+1} / ${records.length}</span><span class="tag">app ${r.app_id}</span><span class="tag">${r.language||'未知语言'}</span><span class="tag">${r.sampling_stratum}</span>`;$('review').textContent=r.source_review_text||'（空评论）';$('reason').textContent='采样说明：'+(r.sampling_reason||'');$('status').value=r.annotation_status||'pending';$('annotator').value=r.annotator_id||'';$('sentiment').value=g.sentiment||'';$('issue').value=g.issue_present===null||g.issue_present===undefined?'':String(g.issue_present);$('request').value=g.request_present===null||g.request_present===undefined?'':String(g.request_present);labels('issueLabels',g.issue_labels||[]);labels('requestLabels',g.request_labels||[]);$('evidence').value=(g.evidence_spans||[]).join('\n');$('draft').innerHTML=d?`<p><b>情感：</b>${d.sentiment}</p><p><b>问题：</b>${d.issue_present?'是':'否'} ${d.issue_labels.join(', ')||'—'}</p><p><b>请求：</b>${d.request_present?'是':'否'} ${d.request_labels.join(', ')||'—'}</p><p><b>不确定：</b><span class="${dr.uncertain?'status err':'status ok'}">${dr.uncertain?'需要核验':'相对明确'}</span></p>${dr.uncertain_reasons.length?`<p class="hint">${dr.uncertain_reasons.join('；')}</p>`:''}`:'<p class="hint">没有草稿</p>';$('count').textContent=`${index+1} / ${records.length} · 已完成 ${records.filter(x=>x.annotation_status==='labeled').length}`;$('bar').style.width=(records.filter(x=>x.annotation_status==='labeled').length/records.length*100)+'%';document.querySelectorAll('.item').forEach(x=>x.classList.toggle('active',Number(x.dataset.i)===index));}
async function save(next=false){const r=records[index], payload={sample_id:r.sample_id,annotation_status:$('status').value,annotator_id:$('annotator').value,sentiment:$('sentiment').value||null,issue_present:$('issue').value===''?null:$('issue').value==='true',issue_labels:values('issueLabels'),request_present:$('request').value===''?null:$('request').value==='true',request_labels:values('requestLabels'),subcategories:[...new Set([...values('issueLabels'),...values('requestLabels')])],evidence_spans:$('evidence').value.split('\n').map(x=>x.trim()).filter(Boolean),annotation_notes:'',adjudication_status:'not_started'};if(payload.annotation_status==='labeled'&&!payload.sentiment){msg('请先选择情感','err');return}const res=await (await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})).json();if(!res.ok){msg(res.error||'保存失败','err');return}Object.assign(r,{annotation_status:payload.annotation_status,annotator_id:payload.annotator_id,gold:{sentiment:payload.sentiment,issue_present:payload.issue_present,issue_labels:payload.issue_labels,request_present:payload.request_present,request_labels:payload.request_labels,subcategories:payload.subcategories,evidence_spans:payload.evidence_spans}});renderList();render();msg('已保存','ok');if(next&&index<records.length-1){index++;render();}}
function msg(t,c){$('statusMsg').textContent=t;$('statusMsg').className='status '+c;setTimeout(()=>{$('statusMsg').textContent=''},2200)}
$('save').onclick=()=>save(false);$('saveNext').onclick=()=>save(true);$('prev').onclick=()=>{if(index){index--;render()}};$('next').onclick=()=>{if(index<records.length-1){index++;render()}};document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();save(false)}else if(e.key==='ArrowRight'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){index=Math.min(records.length-1,index+1);render()}else if(e.key==='ArrowLeft'&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)){index=Math.max(0,index-1);render()}});boot();
</script>
</body></html>
